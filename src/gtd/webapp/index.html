<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GTD</title>
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GTD" />
<meta name="theme-color" content="#0f172a" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="topbar">
  <button id="nav-btn" class="icon-btn" aria-label="Menu">☰</button>
  <h1 id="view-title">Next Steps</h1>
  <button id="refresh-btn" class="icon-btn" aria-label="Refresh">↻</button>
  <button id="settings-btn" class="icon-btn" aria-label="Settings">⚙</button>
</header>

<main id="views">
  <!-- One generic list view serves every entry tab; the chip row doubles as
       the context filter (Next Steps) and the category picker (Lists). -->
  <section id="view-list" class="view">
    <div id="chips" class="chips hidden"></div>
    <ul id="entry-list" class="entry-list"></ul>
    <p id="list-empty" class="empty hidden"></p>
  </section>

  <section id="view-capture" class="view hidden">
    <form id="capture-form">
      <textarea id="capture-input" placeholder="What's on your mind?" autocomplete="off"></textarea>
      <button type="submit">Capture</button>
    </form>
    <p id="capture-status" class="status"></p>
  </section>
</main>

<!-- Full-screen navigation. Eight tabs will not fit a bottom bar at a 44px
     touch target, so view switching lives here instead. -->
<nav id="nav-menu" class="nav-menu hidden" aria-label="Views"></nav>

<div id="modal-backdrop" class="modal-backdrop hidden">
  <div id="modal" class="modal"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
