default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # Git runs the whole pre-commit stage before it ever reaches commit-msg, so
  # the commitizen hook below can only reject a bad message *after* the tests.
  # This one recovers the `git commit -m` message from git's argv and checks it
  # first, so a malformed message fails in ~1s instead of ~15s.
  - repo: local
    hooks:
      - id: commitizen-early
        name: Commitizen check (early)
        entry: python3 scripts/check_commit_msg_early.py
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
        fail_fast: true

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.5
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: mixed-line-ending

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        args: ["-i", "4"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: ruff check --fix
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: Ruff format
        entry: bash -c 'ruff format "$@" && git add "$@"' --
        language: system
        types: [python]
        pass_filenames: true
        require_serial: true

      - id: sync-readme
        name: Sync README menu
        entry: bash -c 'uv run python scripts/update_readme.py && git add README.md'
        language: system
        files: ^(src/gtd/.*\.py|scripts/.*\.py|README\.md)$
        pass_filenames: false

      - id: tests
        name: Tests
        entry: bash -c 'uv run --extra api pytest tests/ -q'
        language: system
        files: ^(src/|tests/).*
        pass_filenames: false
