default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # Rejects a bad commit message during the pre-commit stage, before the ~15s
  # test hook, by recovering it from git's argv -- the commitizen hook below
  # runs in a separate git invocation and can only ever fail after the suite.
  - repo: https://github.com/dannybrown37/git-a-grip
    rev: v0.8.1
    hooks:
      - id: commitizen-early
        fail_fast: true
      - id: ruff-check
      - id: ruff-format
      - id: pytest
        args: ['--runner=uv run --extra api pytest', tests/, -q]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.5
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: mixed-line-ending

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        args: ["-i", "4"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: sync-readme
        name: Sync README menu
        entry: bash -c 'uv run python scripts/update_readme.py && git add README.md'
        language: system
        files: ^(src/gtd/.*\.py|scripts/.*\.py|README\.md)$
        pass_filenames: false
