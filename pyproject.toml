[project]
name = "gtd-tui"
version = "0.13.2"
description = "GTD + 12-Week Year CLI powered by Notion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["click>=8.1.0", "httpx>=0.28.0", "icalendar>=7.3.0", "iterfzf>=1.9.0", "pydantic>=2.13.4", "python-dateutil>=2.9.0.post0", "recurring-ical-events>=3.8.2", "textual>=0.71.0"]

[project.urls]
Repository = "https://github.com/dannybrown37/gtd"

[project.optional-dependencies]
api = ["flask>=3.1.0"]


[project.scripts]
gtd = "gtd.cli:main"


# The `mypy` hook passes no targets, so this is the single answer to "what
# does this repo type-check" -- the same one whether mypy runs from the hook
# or from your shell.
[tool.mypy]
files = ["src"]

# iterfzf ships no stubs and no py.typed, so there is nothing to install.
# Scoped to the one module rather than set globally: blanket
# ignore_missing_imports would turn every third-party symbol into Any and
# silently stop reporting the mistakes mypy is here to catch.
[[tool.mypy.overrides]]
module = ["iterfzf"]
ignore_missing_imports = true

# `recurring_ical_events` ships no py.typed. Scoped to that one module so
# the rest of the calendar code keeps being type-checked properly.
[[tool.mypy.overrides]]
module = ["recurring_ical_events"]
ignore_missing_imports = true


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gtd = ["webapp/*", "webapp/icons/*"]


[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"


[tool.ruff]
line-length = 79
show-fixes = true
target-version = "py312"

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "B", "C4", "COM", "C90",
  "D200", "D201", "D202", "D205", "D212",
  "E", "EM", "ERA", "EXE", "F", "FBT", "G", "I", "ICN", "ISC", "N",
  "PGH", "PIE", "PL", "PLE", "PLR", "PLW", "PT", "PTH", "PYI", "Q",
  "RET", "RSE", "RUF", "S", "SLF", "SIM", "TCH", "TID", "TRY", "W",
  "UP", "YTT",
]
ignore = [
    "S311",
    "S101",
    "I001",
    "S113",
    "PLR0913",
    "PLC0415",
    "COM812",  # conflicts with formatter
    "FBT001",  # click uses bool positional args by design
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["ANN201", "PLR2004", "ANN001", "ANN003", "ARG002", "PT019"]
"tests/**" = ["ANN201", "PLR2004", "ANN001", "ANN003", "ARG002", "PT019"]
"api.py" = ["ANN401"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[dependency-groups]
dev = [
    "commitizen>=4.10.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
addopts = "-n 6"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
major_version_zero = true
# BOOTSTRAP ONLY: true crashes `cz bump` with NoRevisionError when the repo
# has zero tags (incremental changelog has nothing to diff against). Flip
# back to true in a follow-up commit once v0.1.0 exists.
update_changelog_on_bump = true
