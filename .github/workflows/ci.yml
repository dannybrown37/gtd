name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install ruff and pre-commit
        run: |
          # Pinned to match .pre-commit-config.yaml / local dev setup.
          uv tool install "ruff==0.16.0"
          uv tool install pre-commit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run tests
        run: uv run --extra api pytest --cov=src --cov-report=term-missing tests/

  bump:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'bump:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create bump commit and tag
        id: cz
        uses: commitizen-tools/commitizen-action@0.24.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # actions/checkout leaves HEAD detached even on push events, so the
          # action's own `git branch --show-current` fallback resolves to "" —
          # pass the branch explicitly or the push step silently no-ops.
          branch: ${{ github.ref_name }}
          # no_raise defaults to "21" (NO_COMMITS_TO_BUMP) — pushes with no
          # feat/fix-type commits since the last tag are a no-op, not a failure.
          # debug surfaces the real traceback if this still fails silently —
          # drop once the pipeline is verified working end-to-end.
          debug: true
          # BOOTSTRAP ONLY: `cz bump --changelog` hardcodes an incremental
          # changelog diff against the previous tag, which crashes with
          # NoRevisionError when the repo has zero tags. Re-enable
          # `changelog: true` (or remove this line, true is the default) in a
          # follow-up commit once v0.1.0 exists — every bump after the first
          # will have a prior tag to diff against.
          changelog: false
