name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install ruff and pre-commit
        run: |
          # Pinned to match .pre-commit-config.yaml / local dev setup.
          uv tool install "ruff==0.16.0"
          uv tool install pre-commit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run tests
        run: uv run --extra api pytest --cov=src --cov-report=term-missing tests/
