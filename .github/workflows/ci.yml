name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install ruff and pre-commit
        run: |
          # Pinned to match .pre-commit-config.yaml / local dev setup.
          uv tool install "ruff==0.16.0"
          uv tool install pre-commit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run tests
        run: uv run --extra api pytest --cov=src --cov-report=term-missing tests/

  bump:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'bump:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release deploy key is the only actor the `main` ruleset lets push
      # directly. Credentials must persist: the last step pushes the bump.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and tag
        id: cz
        run: |
          PRE_SHA="$(git rev-parse HEAD)"
          uv run cz --no-raise 21 bump --yes
          POST_SHA="$(git rev-parse HEAD)"
          if [[ "$PRE_SHA" != "$POST_SHA" ]]; then
            echo "bumped=true" >>"$GITHUB_OUTPUT"

            # cz bump only touches pyproject.toml's version, so uv.lock's
            # embedded gtd-tui version drifts. Re-lock and fold the result
            # into the bump commit, keeping the tag on that same commit.
            uv lock
            if ! git diff --quiet -- uv.lock; then
              TAG="$(git describe --tags --exact-match HEAD)"
              git tag -d "$TAG"
              git add uv.lock
              git commit --amend --no-edit
              git tag "$TAG"
            fi
          else
            echo "bumped=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Push bump commit and tag
        if: steps.cz.outputs.bumped == 'true'
        # cz bump creates a lightweight tag, so --follow-tags (annotated-only)
        # wouldn't push it — push tags explicitly instead.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: git push origin "HEAD:$REF_NAME" --tags
