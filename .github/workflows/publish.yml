name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Deploys the freshly published version to the Oracle Cloud VM.
  # Implemented in deploy.yml so it can also be run by hand from the Actions
  # tab (workflow_dispatch) without cutting a release.
  deploy:
    needs: publish
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
